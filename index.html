
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ME-R</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap');
    
    body {
      font-family: 'Noto Sans KR', sans-serif;
      background-color: #121318;
      color: #e2e2e9;
      overflow-x: hidden;
    }

    /* 머티리얼 유 디자인 컴포넌트 */
    .m3-card {
      background-color: #1a1b23;
      border-radius: 28px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .m3-btn {
      border-radius: 100px;
      font-weight: 700;
      transition: all 0.3s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .m3-btn-primary {
      background-color: #a4f59c;
      color: #043907;
    }

    .m3-btn-primary:hover {
      background-color: #bcffb3;
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(164, 245, 156, 0.25);
    }
    
    .m3-btn-primary:active {
      transform: translateY(1px);
    }

    .m3-chip {
      border-radius: 8px;
      transition: all 0.25s cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .m3-chip.active {
      background-color: #314b32;
      color: #a4f59c;
      border-color: #a4f59c;
    }

    /* 초정밀 스프링/탄성 애니메이션 클래스 */
    .spring-pop {
      animation: springPop 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes springPop {
      0% { transform: scale(0.6) rotate(-15deg); opacity: 0; }
      70% { transform: scale(1.1) rotate(5deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    /* 결과 카드가 부드럽게 위로 올라오며 나타나는 연출 */
    .slide-up-fade {
      animation: slideUpFade 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes slideUpFade {
      0% { transform: translateY(30px); opacity: 0; filter: blur(5px); }
      100% { transform: translateY(0); opacity: 1; filter: blur(0); }
    }

    /* 동적 회전 링 제어 */
    .ring-spin-fast {
      animation: spinRing 0.4s linear infinite;
    }

    .ring-spin-slow {
      animation: spinRing 30s linear infinite;
    }

    @keyframes spinRing {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* 확정 순간 터지는 파티클 효과 */
    .particle {
      position: absolute;
      pointer-events: none;
      border-radius: 50%;
      animation: explode 0.8s cubic-bezier(0.1, 0.8, 0.3, 1) forwards;
    }

    @keyframes explode {
      0% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
      100% { transform: translate(var(--tx), var(--ty)) scale(0); opacity: 0; }
    }

    /* 스크롤바 최적화 */
    #item-grid-list::-webkit-scrollbar {
      width: 6px;
    }
    #item-grid-list::-webkit-scrollbar-track {
      background: transparent;
    }
    #item-grid-list::-webkit-scrollbar-thumb {
      background: #313341;
      border-radius: 10px;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between selection:bg-[#a4f59c] selection:text-[#043907]">

  <!-- 상단 헤더 -->
  <header class="bg-[#121318] sticky top-0 z-50 py-4 px-6 border-b border-[#22232a]">
    <div class="max-w-md mx-auto flex items-center justify-between">

        <span class="material-icons-round text-[#a4f59c] text-3xl animate-pulse">bolt</span>
        <h1 class="text-xl font-black text-white tracking-tight">ME-R</h1>
      </div>
    </div>
  </header>

  <!-- 메인 레이아웃 -->
  <main class="flex-grow max-w-md w-full mx-auto px-4 py-6 flex flex-col justify-start space-y-6">
    
    <!-- 타이틀 영역 -->
    <div class="text-left px-2">
      <h2 class="text-2xl font-black text-white leading-tight">지금 마실 몬스터는?</h2>
      <p class="text-sm text-gray-400 mt-1.5">몬스터를 아주 빠르게 뽑고 아주 쳐 빠르게 드세요!</p>
    </div>

    <!-- 필터링 칩스 -->
    <div class="px-2">
      <div class="flex flex-wrap gap-2">
        <button onclick="toggleFilter('all')" id="filter-all" class="m3-chip active text-xs px-4 py-2 border border-gray-700 bg-[#1a1b23] text-gray-300">
          전체
        </button>
        <button onclick="toggleFilter('zero')" id="filter-zero" class="m3-chip text-xs px-4 py-2 border border-gray-700 bg-[#1a1b23] text-gray-300 flex items-center">
          <span class="material-icons-round text-xs mr-1">eco</span> 제로 슈거
        </button>
        <button onclick="toggleFilter('fruity')" id="filter-fruity" class="m3-chip text-xs px-4 py-2 border border-gray-700 bg-[#1a1b23] text-gray-300 flex items-center">
          <span class="material-icons-round text-xs mr-1">forest</span> 과즙/상큼함
        </button>
      </div>
    </div>

    <!-- 메인 추천 카드 -->
    <div class="m3-card p-6 flex flex-col items-center relative overflow-hidden">
      
      <!-- 중심 그래픽 영역 -->
      <div class="relative w-48 h-48 mb-6 flex items-center justify-center bg-[#13141a] rounded-full border-2 border-gray-800 shadow-inner" id="wheel-container">
        <!-- 배경 다이내믹 그라디언트 글로우 -->
        <div id="dynamic-radial" class="absolute inset-0 rounded-full opacity-10 transition-all duration-1000" style="background: radial-gradient(circle, #a4f59c 0%, transparent 75%);"></div>
        
        <div class="z-10 text-center select-none">
          <span id="display-emoji" class="text-5xl block mb-2 transform transition-transform duration-100">🥫</span>
          <span id="display-sub" class="text-[11px] font-bold text-gray-500 tracking-wider block transition-colors duration-300">준비됨</span>
          <h3 id="display-name" class="text-lg font-black text-white mt-1 px-4 truncate max-w-[170px] transition-colors duration-300">룰렛 시작하기</h3>
        </div>

        <!-- 데코레이션 링 (상태에 따라 도는 속도가 달라짐) -->
        <div id="deco-ring" class="absolute inset-3 border border-dashed border-gray-800 rounded-full ring-spin-slow"></div>
      </div>

      <!-- 추천 결과 카드 (부드럽게 페이드 및 슬라이드업) -->
      <div id="result-container" class="w-full space-y-4 hidden opacity-0">
        <div class="bg-[#121318] p-4 rounded-2xl border border-gray-800 transition-all duration-300">
          <div class="flex justify-between items-center mb-2.5">
            <span id="res-tag" class="text-xs font-bold px-3 py-1.5 rounded-full transition-all duration-300">오리지널</span>
            <span id="res-calories" class="text-xs text-gray-400 bg-[#1a1b23] px-2.5 py-1 rounded-lg">168 kcal</span>
          </div>
          <p id="res-desc" class="text-xs text-gray-300 leading-relaxed transition-all duration-300"></p>
        </div>

        <!-- 재고 부족 대비 추천 -->
        <div class="bg-[#2a201b] border border-[#ffb4ab]/10 p-4 rounded-2xl transition-all duration-300">
          <div class="flex items-center space-x-2 text-[#ffb4ab] mb-2">
            <span class="material-icons-round text-sm">running_with_errors</span>
            <h4 class="text-xs font-bold">제품이 없나요?</h4>
          </div>
          <p class="text-[11px] text-[#ffdad6] mb-3">비슷한 맛을 추천 해드릴게요!</p>
          
          <div id="backup-item" class="bg-[#1a1b23]/80 p-3 rounded-xl flex items-center justify-between border border-gray-800 hover:border-gray-500 transition-all duration-300 cursor-pointer active:scale-[0.98]">
            <div class="flex items-center space-x-2">
              <span id="backup-emoji" class="text-lg">⚪</span>
              <div>
                <p id="backup-name" class="text-xs font-bold text-white"></p>
                <p id="backup-tag" class="text-[10px] text-gray-500"></p>
              </div>
            </div>
            <span class="material-icons-round text-gray-500 text-sm">arrow_forward_ios</span>
          </div>
        </div>
      </div>

      <!-- 작동 버튼 -->
      <button id="pick-btn" class="m3-btn m3-btn-primary w-full py-4 mt-6 flex items-center justify-center space-x-2 active:scale-[0.98] cursor-pointer">
        <span class="material-icons-round text-xl">casino</span>
        <span>RoLL It!</span>
      </button>

    </div>

    <!-- 전체 라인업 목록 (스크롤 문제 완벽 해결 버전) -->

      <div class="flex justify-between items-center cursor-pointer select-none" id="collapse-trigger">
        <div class="flex items-center space-x-2">
          <span class="material-icons-round text-[#a4f59c]">format_list_bulleted</span>
          <span class="text-sm font-bold text-white">등록된 제품 목록 (<span id="count-span">0</span>)</span>
        </div>
        <span class="material-icons-round text-gray-400 transition-transform duration-300" id="collapse-arrow">expand_more</span>
      </div>

      <!-- 아코디언 컨테이너: 부드러운 스크롤 처리 -->
      <div id="list-container" class="max-h-0 overflow-hidden transition-all duration-500 ease-in-out">
        <div class="grid grid-cols-1 gap-2 mt-4 max-h-72 overflow-y-auto pr-1" id="item-grid-list">
          <!-- 스크립트 동적 주입 -->
        </div>
      </div>
    </div>

  </main>

  <!-- 하단 영역 -->
  <footer class="py-6 text-center text-[11px] text-gray-600 bg-[#121318]">
    <p>Made by JTY</p>
  </footer>

  <!-- 알림 토스트 (스프링 슬라이드 인) -->
  <div id="m3-snackbar" class="fixed bottom-6 left-4 right-4 md:left-auto md:right-6 md:max-w-xs bg-[#2e3038] text-[#e2e2e9] py-3.5 px-5 rounded-2xl shadow-2xl flex items-center justify-between text-xs transform translate-y-24 opacity-0 transition-all duration-300 z-50">
    <div class="flex items-center space-x-2">
      <span class="material-icons-round text-[#a4f59c]">check_circle</span>
      <span id="snackbar-text">준비되었습니다.</span>
    </div>
    <button onclick="hideSnackbar()" class="text-[#a4f59c] font-bold ml-3 cursor-pointer">닫기</button>
  </div>

  <!-- 스크립트 핵심 로직 -->
  <script>

        calories: "168 kcal",

      {

        isZero: true,

        backupId: "ultra_citra"
      },
      {
        id: "ultra_citra",
        name: "울트라 시트라",
        color: "#fff500",
        secondaryColor: "#212100",
        calories: "11 kcal",
        emoji: "🍋",
        tag: "상큼하고 가벼운 라임",
        desc: "레몬과 시원한 라임 과일 풍미가 강조되어, 상큼하고 가벼운 목넘김을 자랑하는 무설탕 음료입니다.",
        isZero: true,
        isFruity: true,

      },
      {

        secondaryColor: "#3d0011",
        calories: "150 kcal",
        emoji: "🥊",
        tag: "달콤한 열대 과즙",
        desc: "상큼하고 달콤한 패션후르츠, 오렌지, 구아바 풍미가 기분 좋게 믹스된 대표 과즙 라인업입니다.",
        isZero: false,
        isFruity: true,
        backupId: "mango_loco"
      },
      {
        id: "mango_loco",
        name: "망고 로코",
        color: "#ffa200",
        secondaryColor: "#382000",
        calories: "175 kcal",
        emoji: "🥭",
        tag: "진한 망고 과즙",
        desc: "달콤하고 부드러운 진짜 망고 퓨레 풍미와 짜릿한 에너지를 가득 느낄 수 있는 달콤한 탄산음료입니다.",
        isZero: false,
        isFruity: true,
        backupId: "pipeline"
      },
      {
        id: "ultra_paradise",
        name: "울트라 파라다이스",
        color: "#00f5bc",
        secondaryColor: "#00382a",
        calories: "14 kcal",
        emoji: "🥝",
        tag: "청량한 키위 멜론",
        desc: "시원한 청량감을 자랑하는 잘 익은 키위와 멜론 계열 향이 감돌아 상쾌하게 기분 전환을 돕는 제로 칼로리 음료입니다.",
        isZero: true,
        isFruity: true,
        backupId: "ultra_citra"
      },
      {
        id: "zero_sugar",
        name: "제로 슈거",
        color: "#00b4d8",
        secondaryColor: "#002a35",
        calories: "16 kcal",
        emoji: "💙",
        tag: "오리지널 구현 제로",
        desc: "오리지널 몬스터 특유의 진한 풍미와 에너지는 고스란히 간직한 채 칼로리 부담만 제로 수준으로 뺀 캔입니다.",
        isZero: true,
        isFruity: false,
        backupId: "original"
      },
      {
        id: "sunrise",
        name: "울트라 선라이즈",
        color: "#ffaa00",
        secondaryColor: "#2d1600",
        calories: "10 kcal",
        emoji: "🍊",
        tag: "가벼운 귤 오렌지",
        desc: "맑고 가벼운 귤 오렌지 에센스 풍미로, 아침 시간대에도 깔끔하게 즐기기 좋은 가벼운 제로 제품입니다.",
        isZero: true,
        isFruity: true,
        backupId: "peach_keen"
      },
      {
        id: "peach_keen",
        name: "피치 킨",
        color: "#ff9f89",
        secondaryColor: "#3d1000",
        calories: "12 kcal",
        emoji: "🍑",
        tag: "진한 복숭아 향",
        desc: "풍성하게 차오르는 잘 익은 복숭아 과일향이 달달하게 입안을 감싸는 신규 무설탕 제로 라인업입니다.",
        isZero: true,
        isFruity: true,
        backupId: "sunrise"
      }
    ];

    let activeFilter = 'all';
    let isRolling = false;
    let listOpen = false;

    // DOM 캐싱
    const displayEmoji = document.getElementById('display-emoji');
    const displayName = document.getElementById('display-name');
    const displaySub = document.getElementById('display-sub');
    const dynamicRadial = document.getElementById('dynamic-radial');
    const decoRing = document.getElementById('deco-ring');
    const wheelContainer = document.getElementById('wheel-container');
    
    const resultContainer = document.getElementById('result-container');
    const resTag = document.getElementById('res-tag');
    const resCalories = document.getElementById('res-calories');
    const resDesc = document.getElementById('res-desc');
    
    const backupItem = document.getElementById('backup-item');
    const backupEmoji = document.getElementById('backup-emoji');
    const backupName = document.getElementById('backup-name');
    const backupTag = document.getElementById('backup-tag');
    
    const pickBtn = document.getElementById('pick-btn');
    const collapseTrigger = document.getElementById('collapse-trigger');
    const collapseArrow = document.getElementById('collapse-arrow');
    const listContainer = document.getElementById('list-container');
    const itemGridList = document.getElementById('item-grid-list');
    const countSpan = document.getElementById('count-span');
    const snackbar = document.getElementById('m3-snackbar');
    const snackbarText = document.getElementById('snackbar-text');

    // 초기설정
    countSpan.textContent = db.length;
    renderAllItems();

    function toggleFilter(filterType) {
      if (isRolling) return;
      activeFilter = filterType;
      
      ['all', 'zero', 'fruity'].forEach(type => {
        const btn = document.getElementById(`filter-${type}`);
        if (type === filterType) {
          btn.classList.add('active', 'bg-[#314b32]', 'text-[#a4f59c]', 'border-[#a4f59c]');
          btn.classList.remove('bg-[#1a1b23]', 'text-gray-300', 'border-gray-700');
        } else {
          btn.classList.remove('active', 'bg-[#314b32]', 'text-[#a4f59c]', 'border-[#a4f59c]');
          btn.classList.add('bg-[#1a1b23]', 'text-gray-300', 'border-gray-700');
        }
      });

      let msg = "전체 제품 목록에서 추천합니다.";
      if (filterType === 'zero') msg = "제로 슈거 제품 중에서 추천합니다.";
      if (filterType === 'fruity') msg = "상큼/과즙 라인업에서 추천합니다.";
      showSnackbar(msg);
    }

    function getFilteredList() {
      if (activeFilter === 'zero') return db.filter(item => item.isZero);
      if (activeFilter === 'fruity') return db.filter(item => item.isFruity);
      return db;
    }

    // 파티클 폭죽 효과 생성기
    function spawnParticles(color) {
      const particleCount = 15;
      for (let i = 0; i < particleCount; i++) {
        const p = document.createElement('div');
        p.className = 'particle';
        
        // 머티리얼 유 컬러 혹은 선정된 몬스터 컬러
        p.style.backgroundColor = color;
        
        // 크기 랜덤
        const size = Math.random() * 8 + 4;
        p.style.width = `${size}px`;
        p.style.height = `${size}px`;
        
        // 룰렛 중앙 위치에 생성
        p.style.left = '50%';
        p.style.top = '50%';
        
        // 무작위 퍼짐 각도 및 도달 거리 계산
        const angle = Math.random() * Math.PI * 2;
        const distance = Math.random() * 100 + 60;
        const tx = Math.cos(angle) * distance;
        const ty = Math.sin(angle) * distance;
        
        p.style.setProperty('--tx', `${tx}px`);
        p.style.setProperty('--ty', `${ty}px`);
        
        wheelContainer.appendChild(p);
        
        // 800ms 애니메이션 종료 후 확실히 소멸
        setTimeout(() => p.remove(), 800);
      }
    }

    // 데이터 화면에 반영 & 탄성 애니메이션 트리거
    function applyResult(item, runConfetti = false) {
      // 바운스 효과 제거 후 리셋 트리거
      displayEmoji.classList.remove('spring-pop');
      void displayEmoji.offsetWidth; // 리플로우 강제 트리거
      displayEmoji.classList.add('spring-pop');

      displayEmoji.textContent = item.emoji;
      displayName.textContent = item.name;
      displayName.style.color = item.color;
      displaySub.textContent = item.tag;
      dynamicRadial.style.background = `radial-gradient(circle, ${item.color} 0%, transparent 75%)`;
      dynamicRadial.style.opacity = "0.3";

      resTag.textContent = item.tag;
      resTag.style.backgroundColor = `${item.color}22`;
      resTag.style.color = item.color;
      resCalories.textContent = item.calories;
      resDesc.textContent = item.desc;

      const fallbackTarget = db.find(d => d.id === item.backupId) || db[0];
      backupEmoji.textContent = fallbackTarget.emoji;
      backupName.textContent = fallbackTarget.name;
      backupTag.textContent = `'${fallbackTarget.tag}' 맛과 가장 흡사해요`;
      
      backupItem.onclick = () => {
        applyResult(fallbackTarget, true);
        showSnackbar(`대체 추천 제품 정보로 전환되었습니다.`);
      };

      // 결과 영역 표시 및 슬라이드업 애니메이션 실행
      resultContainer.classList.remove('hidden');
      resultContainer.classList.remove('slide-up-fade');
      void resultContainer.offsetWidth;
      resultContainer.classList.add('slide-up-fade');

      if (runConfetti) {
        spawnParticles(item.color);
      }
    }

    // 물리 기반 감속(Ease-Out) 룰렛 구현
    function runPhysicsRoulette(pool) {
      isRolling = true;
      resultContainer.classList.add('hidden');
      
      // 데코링 가속 회전
      decoRing.classList.remove('ring-spin-slow');
      decoRing.classList.add('ring-spin-fast');

      pickBtn.disabled = true;
      pickBtn.style.opacity = '0.6';
      pickBtn.querySelector('span').textContent = '캔 고르는 중...';
      pickBtn.querySelector('.material-icons-round').textContent = 'hourglass_empty';

      let currentDelay = 40; // 시작 딜레이 (매우 빠르게 셔플)
      const maxDelay = 450;  // 멈추기 직전 최대 딜레이 (느려짐의 한계선)
      const multiplier = 1.15; // 딜레이 증가율 (클수록 마찰력이 강함)

      function step() {
        const randomItem = pool[Math.floor(Math.random() * pool.length)];
        
        displayEmoji.textContent = randomItem.emoji;
        displayName.textContent = randomItem.name;
        displayName.style.color = randomItem.color;
        displaySub.textContent = "에너지 추출 중...";

        // 고속 회전 시 미세 진동 효과
        displayEmoji.style.transform = `scale(${1 + Math.random() * 0.15}) rotate(${Math.random() * 16 - 8}deg)`;

        if (currentDelay < maxDelay) {
          // 마찰에 의해 회전 주기가 점진적으로 길어짐 (물리 감속)
          currentDelay *= multiplier;
          setTimeout(step, currentDelay);
        } else {
          // 감속 완료 및 최종 확정
          const finalResult = pool[Math.floor(Math.random() * pool.length)];
          
          // 링 속도 원래대로
          decoRing.classList.remove('ring-spin-fast');
          decoRing.classList.add('ring-spin-slow');

          // 결과 화면 렌더링 및 폭죽 이펙트
          applyResult(finalResult, true);

          // 버튼 제어 복구
          pickBtn.disabled = false;
          pickBtn.style.opacity = '1';
          pickBtn.querySelector('span').textContent = '무작위 뽑기';
          pickBtn.querySelector('.material-icons-round').textContent = 'casino';
          isRolling = false;

          showSnackbar(`최적의 몬스터 결정: ${finalResult.name}`);
        }
      }

      // 회전 프로세스 가동
      setTimeout(step, currentDelay);
    }

    pickBtn.addEventListener('click', () => {
      if (isRolling) return;
      
      const pool = getFilteredList();
      if (pool.length === 0) {
        showSnackbar("해당 필터에 만족하는 제품이 없습니다.");
        return;
      }

      runPhysicsRoulette(pool);
    });

    function renderAllItems() {
      itemGridList.innerHTML = '';
      db.forEach(item => {
        const card = document.createElement('div');
        card.className = 'bg-[#121318] p-3 rounded-xl border border-gray-800 flex items-center justify-between hover:border-gray-600 transition-all duration-300 cursor-pointer active:scale-[0.98]';
        card.onclick = () => {
          if (isRolling) return;
          applyResult(item, true);
          window.scrollTo({ top: 100, behavior: 'smooth' });
        };

        card.innerHTML = `
          <div class="flex items-center space-x-3">
            <span class="text-xl">${item.emoji}</span>
            <div>
              <p class="text-xs font-bold text-white">${item.name}</p>
              <p class="text-[10px] text-gray-400 mt-0.5">${item.tag}</p>
            </div>
          </div>
          <span class="text-[10px] text-gray-500 bg-[#1a1b23] px-2 py-1 rounded-md">${item.calories}</span>
        `;
        itemGridList.appendChild(card);
      });
    }

    collapseTrigger.addEventListener('click', () => {
      listOpen = !listOpen;
      if (listOpen) {
        listContainer.style.maxHeight = '420px';
        collapseArrow.style.transform = 'rotate(180deg)';
      } else {
        listContainer.style.maxHeight = '0px';
        collapseArrow.style.transform = 'rotate(0deg)';
      }
    });

    let snackTimeout;
    function showSnackbar(msg) {
      clearTimeout(snackTimeout);
      snackbarText.textContent = msg;
      snackbar.style.opacity = '1';
      snackbar.style.transform = 'translateY(0)';

      snackTimeout = setTimeout(() => {
        hideSnackbar();
      }, 3000);
    }

    function hideSnackbar() {
      snackbar.style.opacity = '0';
      snackbar.style.transform = 'translateY(24px)';
    }
  </script>
</body>
</html>
